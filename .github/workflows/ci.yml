name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install Compact toolchain
      run: |
        curl -sSL https://get.midnight.network/compact | sh || true
        if [ -d "$HOME/.compact/bin" ]; then
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
        fi
    
    - name: Compile Compact contract (if toolchain available)
      continue-on-error: true
      run: |
        if command -v compact &> /dev/null; then
          compact --version
          npm run compile
        else
          echo "⚠️  Compact toolchain not available - skipping compilation"
          echo "Tests will validate contract logic without compiled circuits"
        fi
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run test suite
      run: npm test
    
    - name: Install frontend dependencies
      run: cd frontend && npm ci
    
    - name: Build frontend
      run: cd frontend && npm run build

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install Compact toolchain
      run: |
        curl -sSL https://get.midnight.network/compact | sh
        echo "$HOME/.compact/bin" >> $GITHUB_PATH
    
    - name: Verify Compact installation
      run: compact --version
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile Compact contract
      run: npm run compile
    
    - name: Run test suite
      run: npm test
    
    - name: Install frontend dependencies
      run: cd frontend && npm ci
    
    - name: Build frontend
      run: cd frontend && npm run build

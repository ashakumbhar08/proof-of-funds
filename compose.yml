# ProofOfFunds — Local Midnight Devnet
# Images from official midnight-local-network stack (ledger-v8 / mainnet-compatible)
#
# Usage:
#   npm run network          → start devnet in background
#   npm run network:stop     → tear it down
#   npm run network:logs     → tail logs
#
# Endpoints:
#   Node         ws://localhost:9944
#   Indexer      http://localhost:8088/api/v1/graphql
#   Proof Server http://localhost:6300

name: proof-of-funds-devnet

services:

  node:
    image: 'midnightntwrk/midnight-node:0.22.1'
    container_name: pof-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  proof-server:
    image: 'midnightntwrk/proof-server:8.0.3'
    container_name: pof-proof-server
    ports:
      - "6300:6300"
    volumes:
      - ./managed:/app/managed:ro    # compiled circuit artefacts
    depends_on:
      node:
        condition: service_healthy

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.0.0'
    container_name: pof-indexer
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: "ws://node:9944"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      start_interval: "5s"
      interval: "5s"
      timeout: "2s"
      retries: 5
      start_period: 10s
    depends_on:
      node:
        condition: service_started

volumes:
  midnight-node-data:
